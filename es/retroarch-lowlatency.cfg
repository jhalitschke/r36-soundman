# Appended to RetroArch for our systems only, never to ArkOS's own emulators.
#
# ALSA's "default" on ArkOS is a dmix mixer whose period_size is written into
# asound.conf as 1024 frames, so no client can get under 2048 frames - 42.7 ms
# at 48 kHz - however low audio_latency is set. Going to the card directly gives
# 768 frames instead. Measured on r36a: below 8 ms it comes apart (2 underruns
# at 5 ms, 8 at 4, 113 at 2); between 8 and 16 single underruns wander and do
# not track the buffer, so 16 is chosen for headroom rather than as an optimum.
#
# The cost is exclusive use of the card. That is free here - ES is stopped while
# a core runs - but nothing else can play meanwhile, which is exactly what dmix
# exists to avoid. Hence: our systems only.
audio_device = "plughw:0,0"
audio_latency = "16"
