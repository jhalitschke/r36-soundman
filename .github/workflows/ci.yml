# Hardware-free CI: shell lint, ES merge tests and an x86 compile check of the core.
# The arm64 build (the real deploy artifact) only runs on demand because of qemu.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint + ES merge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (host and device scripts)
        run: |
          for f in scripts/*.sh ports/*/*.sh tools/*.sh; do bash -n "$f"; done

      - name: shellcheck
        # severity=warning: the info-level notes of the PortMaster scripts (SC1091
        # on control.txt, SC2012) are part of the pattern, not a defect.
        run: shellcheck --severity=warning scripts/*.sh ports/*/*.sh tools/*.sh

      - name: python syntax
        run: python3 -m compileall -q scripts tests

      - name: ES merge tests
        run: python3 -m unittest discover -s tests -v

  cores:
    name: cores (x86 compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build libADLMIDI + adl
        run: make -C cores/adl

      - name: build libOPNMIDI + opn
        run: make -C cores/opn

      - name: core smoke tests (API, symbols, AV info, .info)
        run: |
          python3 tests/core_smoke.py cores/adl/adl_libretro.so
          python3 tests/core_smoke.py cores/opn/opn_libretro.so

      - name: audio tests (pitch, note-off, panic, gain, MIDI wire format)
        run: python3 -m unittest discover -s tests -v

      - name: render the demos and screenshots
        run: |
          python3 scripts/adl_harness.py --demo adl-demo.wav --shots adl-shot
          python3 scripts/adl_harness.py --so cores/opn/opn_libretro.so \
            --bank cores/opn/libOPNMIDI/fm_banks/xg.wopn --demo opn-demo.wav --shots opn-shot

      - uses: actions/upload-artifact@v4
        with:
          name: demos
          path: |
            *-demo.wav
            *-shot-*.png

  cores-arm64:
    name: cores (arm64 in the container)
    # On demand only: qemu-emulated cmake takes far longer than the x86 check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: scripts/build.sh adl + opn
        env:
          UBUNTU: "20.04" # has to match the ArkOS base (device/<host>/inventory.txt)
        run: |
          scripts/build.sh adl
          scripts/build.sh opn

      - name: both .so are aarch64
        run: |
          file cores/*/*_libretro.so
          file cores/*/*_libretro.so | grep -c 'ARM aarch64' | grep -q '^2$'

      - name: nothing needs a newer glibc than the device has
        run: scripts/glibc-check.py --max 2.30 cores/*/*_libretro.so
