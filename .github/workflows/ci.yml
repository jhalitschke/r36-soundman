# CI ohne Hardware: Shell-Lint, ES-Merge-Tests und ein x86-Compile-Check des Cores.
# Der arm64-Build (echtes Deploy-Artefakt) laeuft wegen qemu-Laufzeit nur manuell.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint + ES-Merge-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (Syntax, Host- und Gerätescripts)
        run: |
          for f in scripts/*.sh ports/*/*.sh; do bash -n "$f"; done

      - name: shellcheck
        # severity=warning: die info-Hinweise der PortMaster-Scripts (SC1091 auf
        # control.txt, SC2012) sind Teil des Musters und kein Fehler.
        run: shellcheck --severity=warning scripts/*.sh ports/*/*.sh

      - name: python syntax
        run: python3 -m compileall -q scripts tests

      - name: ES-Merge-Tests
        run: python3 -m unittest discover -s tests -v

  core-adl:
    name: cores/adl (x86-Compile-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: libADLMIDI + Core bauen
        run: make -C cores/adl

      - name: Core-Smoke-Test (API, Symbole, AV-Info, .info)
        run: python3 tests/core_smoke.py cores/adl/adl_libretro.so

      - name: Audio-Tests (Tonhöhe, Note-Off, Panic, Gain)
        run: python3 -m unittest discover -s tests -v

      - name: Demo rendern
        run: python3 scripts/adl_harness.py --demo adl-demo.wav

      - uses: actions/upload-artifact@v4
        with:
          name: adl-demo-wav
          path: adl-demo.wav

  core-adl-arm64:
    name: cores/adl (arm64 im Container)
    # Nur auf Knopfdruck: qemu-emuliertes cmake braucht deutlich laenger als der x86-Check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: scripts/build.sh adl
        env:
          UBUNTU: "20.04" # muss zur ArkOS-Basis passen (device/<host>/inventory.txt)
        run: scripts/build.sh adl

      - name: .so ist aarch64
        run: |
          file cores/adl/adl_libretro.so
          file cores/adl/adl_libretro.so | grep -q 'ARM aarch64'
